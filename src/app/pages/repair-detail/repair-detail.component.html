<div class="repair-detail-layout container">
  <div class="page-inner">
    <div class="page-header">
      <h3 class="fw-bold mb-3">Chi tiết sửa chữa</h3>
      <ul class="breadcrumbs mb-3">
        <li class="nav-home">
          <a href="#">
            <i class="icon-home"></i>
          </a>
        </li>
        <li class="separator">
          <i class="icon-arrow-right"></i>
        </li>
        <li class="nav-item">
          <a href="#">Làm việc</a>
        </li>
        <li class="separator">
          <i class="icon-arrow-right"></i>
        </li>
        <li class="nav-item">
          <a href="#">Sửa chữa</a>
        </li>
        <li class="separator">
          <i class="icon-arrow-right"></i>
        </li>
        <li class="nav-item">
          <a href="#">Chi tiết sửa chữa</a>
        </li>
      </ul>
    </div>
    <div class="row">
      <div class="col-md-12">
        <div class="card">
          <div class="card-header">
            <div class="card-title">Phiếu sửa chữa chi tiết</div>
          </div>
          <div class="card-body">
            <div class="row">
              <div class="col-md-6 col-lg-4">
                <div class="form-group">
                  <label class="form-label">Hình ảnh thiết bị</label>
                  <div class="row">
                    <div class="col-6 col-sm-4">
                      <label class="imagecheck mb-4">
                        <input name="imagecheck" type="checkbox" value="1" class="imagecheck-input" />
                        <img src="../assets/img/examples/product1.jpg" alt="title" class="" />
                      </label>
                    </div>
                  </div>
                </div>
              </div>
              <div class="col-md-6 col-lg-4">
                <div class="form-group form-inline">
                  <label for="inlineinput" class="col-md-3 col-form-label">Tên thiết bị</label>
                  <!-- <div class="col-md-9 p-0"> -->
                  <input class="form-control" type="text" value="{{repair?.deviceName}}" aria-label="Tên thiết bị">
                  <!-- </div> -->
                </div>
                <div class="form-group has-error has-feedback form-inline">
                  <label for="inlineinput" for="errorInput" class="col-md-3 col-form-label">Tình trạng lỗi</label>
                  <input type="text" id="errorInput" value="{{repair?.errorCondition}}" class="form-control" />
                </div>

                <div class="radio-custom">
                  <label class="ps-2 fw-mediumbold">Cho mượn máy</label><br />
                  <div class="d-flex">
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="flexRadioDefault" id="flexRadioDefault1"
                        [value]="true" [checked]="repair?.lend === true" />
                      <label class="form-check-label" for="flexRadioDefault1">
                        Có
                      </label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="flexRadioDefault" id="flexRadioDefault2"
                        [value]="false" [checked]="repair?.lend === false" />
                      <label class="form-check-label" for="flexRadioDefault2">
                        Không
                      </label>
                    </div>
                  </div>
                </div>
                <div class="form-group form-group-default">
                  <h6 class="fw-extrabold">Thời gian nhận</h6>
                  <input class="input-date" type="datetime" id="datetime-input" name="birthdaytime"
                    [value]="repair?.creationDate  | date:'dd-MM-yyy | HHg:mmp'">
                </div>


                <div class="form-group">
                  <label for="disableinput">Disable Input</label>
                  <input type="text" class="form-control" id="disableinput" placeholder="Enter Input" disabled />
                </div>
                <div class="form-group has-success">
                  <label for="successInput">Success Input</label>
                  <input type="text" id="successInput" value="Success" class="form-control" readonly />
                </div>
                <div class="form-group">
                  <label for="comment">Note</label>
                  <textarea class="form-control" id="comment" rows="5" value="{{repair?.note}}">
                    </textarea>
                </div>
                <label class="mb-3"><b>Form Group Default</b></label>
                <div class="form-group form-group-default">
                  <label>Input</label>
                  <input id="Name" type="text" class="form-control" placeholder="Fill Name" />
                </div>
                <div class="form-group form-group-default">
                  <label>Select</label>
                  <select class="form-select" id="formGroupDefaultSelect">
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                    <option>4</option>
                    <option>5</option>
                  </select>
                </div>
              </div>
              <div class="col-md-6 col-lg-4">
                <div class="form-group form-inline">
                  <label for="inlineinput" class="col-md-3 col-form-label">Tên khách hàng</label>
                  <!-- <div class="col-md-9 p-0"> -->
                  <input class="form-control" type="text" value="{{repair?.customer?.fullName}}"
                    aria-label="Tên thiết bị">
                  <!-- </div> -->
                </div>
                <div class="form-group form-inline">
                  <label for="inlineinput" class="col-md-3 col-form-label">Số điện thoại</label>
                  <!-- <div class="col-md-9 p-0"> -->
                  <input class="form-control" type="text" value="{{repair?.customer?.phoneNumber}}"
                    aria-label="Tên thiết bị">
                  <!-- </div> -->
                </div>
                <div class="form-group form-inline">
                  <label for="inlineinput" class="col-md-3 col-form-label">Address khách hàng</label>
                  <!-- <div class="col-md-9 p-0"> -->
                  <input class="form-control" type="text" value="{{repair?.customer?.address}}"
                    aria-label="Tên thiết bị">
                  <!-- </div> -->
                </div>
                <div class="form-group">
                  <label for="inlineinput" class="col-md-3 col-form-label">Thành tiền</label>
                  <div class="input-group mb-3">
                    <input type="text" class="form-control" aria-label="Amount (to the nearest dollar)"
                      value="{{repair?.totalAmount}}" />
                    <span class="input-group-text">VNĐ</span>
                  </div>
                </div>
                <div class="form-group">
                  <div class="input-group">
                    <span class="input-group-text">With textarea</span>
                    <textarea class="form-control" aria-label="With textarea"></textarea>
                  </div>
                </div>
                <div class="form-group">
                  <div class="input-group">
                    <input type="text" class="form-control" aria-label="Text input with dropdown button" />
                    <div class="input-group-append">
                      <button class="btn btn-primary btn-border dropdown-toggle" type="button" data-bs-toggle="dropdown"
                        aria-haspopup="true" aria-expanded="false">
                        Dropdown
                      </button>
                      <div class="dropdown-menu">
                        <a class="dropdown-item" href="#">Action</a>
                        <a class="dropdown-item" href="#">Another action</a>
                        <a class="dropdown-item" href="#">Something else here</a>
                        <div role="separator" class="dropdown-divider"></div>
                        <a class="dropdown-item" href="#">Separated link</a>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="form-group">
                  <div class="input-icon">
                    <input type="text" class="form-control" placeholder="Search for..." />
                    <span class="input-icon-addon">
                      <i class="fa fa-search"></i>
                    </span>
                  </div>
                </div>
                <div class="form-group">
                  <div class="input-icon">
                    <span class="input-icon-addon">
                      <i class="fa fa-user"></i>
                    </span>
                    <input type="text" class="form-control" placeholder="Username" />
                  </div>
                </div>
                <div class="form-group">
                  <label class="form-label">Color Input</label>
                  <div class="row gutters-xs">
                    <div class="col-auto">
                      <label class="colorinput">
                        <input name="color" type="checkbox" value="dark" class="colorinput-input" />
                        <span class="colorinput-color bg-black"></span>
                      </label>
                    </div>
                    <div class="col-auto">
                      <label class="colorinput">
                        <input name="color" type="checkbox" value="primary" class="colorinput-input" />
                        <span class="colorinput-color bg-primary"></span>
                      </label>
                    </div>
                    <div class="col-auto">
                      <label class="colorinput">
                        <input name="color" type="checkbox" value="secondary" class="colorinput-input" />
                        <span class="colorinput-color bg-secondary"></span>
                      </label>
                    </div>
                    <div class="col-auto">
                      <label class="colorinput">
                        <input name="color" type="checkbox" value="info" class="colorinput-input" />
                        <span class="colorinput-color bg-info"></span>
                      </label>
                    </div>
                    <div class="col-auto">
                      <label class="colorinput">
                        <input name="color" type="checkbox" value="success" class="colorinput-input" />
                        <span class="colorinput-color bg-success"></span>
                      </label>
                    </div>
                    <div class="col-auto">
                      <label class="colorinput">
                        <input name="color" type="checkbox" value="danger" class="colorinput-input" />
                        <span class="colorinput-color bg-danger"></span>
                      </label>
                    </div>
                    <div class="col-auto">
                      <label class="colorinput">
                        <input name="color" type="checkbox" value="warning" class="colorinput-input" />
                        <span class="colorinput-color bg-warning"></span>
                      </label>
                    </div>
                  </div>
                </div>
                <div class="form-group">
                  <label class="form-label d-block">Icon input</label>
                  <div class="selectgroup selectgroup-secondary selectgroup-pills">
                    <label class="selectgroup-item">
                      <input type="radio" name="icon-input" value="1" class="selectgroup-input" checked="" />
                      <span class="selectgroup-button selectgroup-button-icon"><i class="fa fa-sun"></i></span>
                    </label>
                    <label class="selectgroup-item">
                      <input type="radio" name="icon-input" value="2" class="selectgroup-input" />
                      <span class="selectgroup-button selectgroup-button-icon"><i class="fa fa-moon"></i></span>
                    </label>
                    <label class="selectgroup-item">
                      <input type="radio" name="icon-input" value="3" class="selectgroup-input" />
                      <span class="selectgroup-button selectgroup-button-icon"><i class="fa fa-tint"></i></span>
                    </label>
                    <label class="selectgroup-item">
                      <input type="radio" name="icon-input" value="4" class="selectgroup-input" />
                      <span class="selectgroup-button selectgroup-button-icon"><i class="fa fa-cloud"></i></span>
                    </label>
                  </div>
                </div>
                <div class="form-group">
                  <label class="form-label">Your skills</label>
                  <div class="selectgroup selectgroup-pills">
                    <label class="selectgroup-item">
                      <input type="checkbox" name="value" value="HTML" class="selectgroup-input" checked="" />
                      <span class="selectgroup-button">HTML</span>
                    </label>
                    <label class="selectgroup-item">
                      <input type="checkbox" name="value" value="CSS" class="selectgroup-input" />
                      <span class="selectgroup-button">CSS</span>
                    </label>
                    <label class="selectgroup-item">
                      <input type="checkbox" name="value" value="PHP" class="selectgroup-input" />
                      <span class="selectgroup-button">PHP</span>
                    </label>
                    <label class="selectgroup-item">
                      <input type="checkbox" name="value" value="JavaScript" class="selectgroup-input" />
                      <span class="selectgroup-button">JavaScript</span>
                    </label>
                    <label class="selectgroup-item">
                      <input type="checkbox" name="value" value="Ruby" class="selectgroup-input" />
                      <span class="selectgroup-button">Ruby</span>
                    </label>
                    <label class="selectgroup-item">
                      <input type="checkbox" name="value" value="Ruby" class="selectgroup-input" />
                      <span class="selectgroup-button">Ruby</span>
                    </label>
                    <label class="selectgroup-item">
                      <input type="checkbox" name="value" value="C++" class="selectgroup-input" />
                      <span class="selectgroup-button">C++</span>
                    </label>
                  </div>
                </div>
              </div>

            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
